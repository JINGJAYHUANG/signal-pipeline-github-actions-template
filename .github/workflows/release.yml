name: Publish Release Branch

on:
  create:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: signal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       startsWith(github.event.ref, 'release/v')) ||
      (github.event_name == 'push' &&
       startsWith(github.ref_name, 'release/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Confirm release branch equals current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Validate release candidate
        env:
          PYTHONPATH: src
        run: python scripts/release_check.py
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "create" ]]; then
            release_ref="${{ github.event.ref }}"
          else
            release_ref="${{ github.ref_name }}"
          fi
          version="${release_ref#release/}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="v$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          test "$version" = "$expected"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Configure release tag identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create, verify or repair the pre-release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION" --force
            tag_sha="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_sha" != "$head_sha" ]]; then
              if gh release view "$VERSION" >/dev/null 2>&1; then
                echo "refusing to move released tag $VERSION" >&2
                exit 1
              fi
              git push origin ":refs/tags/$VERSION"
              git tag -d "$VERSION"
              git tag -a "$VERSION" -m "Signal Pipeline $VERSION" HEAD
              git push origin "$VERSION"
            fi
          else
            git tag -a "$VERSION" -m "Signal Pipeline $VERSION" HEAD
            git push origin "$VERSION"
          fi
          test "$(git rev-list -n 1 "$VERSION")" = "$head_sha"
      - name: Build and verify deterministic release archives
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          git archive --format=tar --prefix="signal-pipeline-$VERSION/" HEAD > "dist/signal-pipeline-$VERSION.tar"
          gzip -n "dist/signal-pipeline-$VERSION.tar"
          git archive --format=zip --prefix="signal-pipeline-$VERSION/" -o "dist/signal-pipeline-$VERSION.zip" HEAD
          (
            cd dist
            sha256sum signal-pipeline-* > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Signal Pipeline $VERSION" \
              --notes-file "docs/release-notes/${VERSION}.md"
            gh release upload "$VERSION" \
              "dist/signal-pipeline-$VERSION.tar.gz" \
              "dist/signal-pipeline-$VERSION.zip" \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$VERSION" \
              "dist/signal-pipeline-$VERSION.tar.gz" \
              "dist/signal-pipeline-$VERSION.zip" \
              dist/SHA256SUMS.txt \
              --title "Signal Pipeline $VERSION" \
              --notes-file "docs/release-notes/${VERSION}.md"
          fi

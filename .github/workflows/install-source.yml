name: Install Public Source

on:
  push:
    branches: ["feat/public-v0.1.0"]
    paths:
      - ".bootstrap/payload.tar.gz"
      - ".github/workflows/install-source.yml"

permissions:
  contents: write

concurrency:
  group: signal-pipeline-source-install
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/public-v0.1.0
          fetch-depth: 0
      - name: Verify and safely extract public source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          payload = root / '.bootstrap' / 'payload.tar.gz'
          expected = '76351e441a226c40f7ad660c8d71ad73dda6d39afc86be339dd470c83243ee8c'
          actual = hashlib.sha256(payload.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload checksum mismatch: {actual}')

          staging = Path('/tmp/signal-pipeline-public-v010')
          shutil.rmtree(staging, ignore_errors=True)
          staging.mkdir(parents=True)
          total_size = 0
          file_count = 0
          with tarfile.open(payload, mode='r:gz') as archive:
              members = archive.getmembers()
              if not members or len(members) > 500:
                  raise SystemExit('archive member count is invalid')
              for member in members:
                  posix = PurePosixPath(member.name)
                  if posix.is_absolute() or '..' in posix.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member type: {member.name}')
                  if member.isfile():
                      file_count += 1
                      total_size += member.size
                  elif not member.isdir():
                      raise SystemExit(f'unsupported archive member: {member.name}')
              if file_count > 300 or total_size > 5_000_000:
                  raise SystemExit('archive exceeds public-source bounds')
              for member in members:
                  posix = PurePosixPath(member.name)
                  clean_parts = tuple(part for part in posix.parts if part not in {'', '.'})
                  if not clean_parts:
                      continue
                  target = staging.joinpath(*clean_parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f'cannot read archive member: {member.name}')
                      target.write_bytes(source.read())

          for item in staging.iterdir():
              destination = root / item.name
              if item.name == '.github':
                  shutil.copytree(item, destination, dirs_exist_ok=True)
              elif item.is_dir():
                  if destination.exists():
                      shutil.rmtree(destination)
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)
          PY
          PYTHONPATH=src python scripts/release_check.py
      - name: Commit readable source without modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .bootstrap .github/workflows
          git diff --cached --quiet && { echo 'no source changes'; exit 0; }
          git commit -m "feat: install public signal pipeline source"
          git push origin HEAD:feat/public-v0.1.0

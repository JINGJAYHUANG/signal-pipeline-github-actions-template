name: Bug report
description: Report a reproducible software defect
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private endpoints, real recipients or proprietary data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
    validations:
      required: true
